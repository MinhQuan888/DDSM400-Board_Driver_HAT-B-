[platformio]
src_dir = main
default_envs = ddsm_open

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = espidf
monitor_speed = 115200

[env:ddsm_open]
build_flags = -DDDSM_APP_MODE=0

[env:ddsm_current]
build_flags = -DDDSM_APP_MODE=1

[env:ddsm_speed]
build_flags = -DDDSM_APP_MODE=2

[env:ddsm_position]
build_flags = -DDDSM_APP_MODE=3

[env:ddsm_mobile]
build_flags = -DDDSM_MOBILE_CONTROL
